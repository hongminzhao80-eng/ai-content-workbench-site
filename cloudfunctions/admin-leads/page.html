<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>线索管理 · AI内容创作工作台</title>
<style>
  :root { --g:#0E3B2C; --gl:#1f7a56; --bg:#f4f7f5; --card:#fff; --line:#dfe8e2; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Microsoft YaHei",system-ui,sans-serif; background:var(--bg); color:#22303a; }
  header { background:var(--g); color:#fff; padding:14px 22px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; font-weight:600; }
  header .hint { font-size:12px; opacity:.75; }
  .toolbar { padding:14px 22px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; background:#fff; border-bottom:1px solid var(--line); }
  .toolbar select, .toolbar input, .toolbar button { padding:7px 10px; border:1px solid #c6d4cc; border-radius:6px; font-size:13px; background:#fff; }
  .toolbar button { background:var(--gl); color:#fff; border-color:var(--gl); cursor:pointer; }
  .toolbar .key-box { margin-left:auto; display:flex; gap:6px; align-items:center; }
  .toolbar .mail-box { display:flex; gap:6px; align-items:center; margin-left:10px; }
  table { width:100%; border-collapse:collapse; background:var(--card); box-shadow:0 1px 3px rgba(0,0,0,.06); font-size:13px; }
  th, td { border-bottom:1px solid var(--line); padding:9px 10px; text-align:left; vertical-align:top; }
  th { background:#eef4f0; font-weight:600; white-space:nowrap; }
  td.msg { max-width:240px; white-space:pre-wrap; word-break:break-all; }
  .tag { display:inline-block; padding:2px 8px; border-radius:10px; font-size:12px; }
  .t-trial{background:#e3f2fd;color:#0b5a9c}.t-demo{background:#fff3e0;color:#a35c00}.t-partner{background:#e8f5e9;color:#1b5e20}
  .s-new{background:#fce4ec;color:#ad1457}.s-contacted{background:#fff8e1;color:#8a6d00}.s-done{background:#e8f5e9;color:#1b5e20}.s-invalid{background:#eee;color:#555}
  button.mini { padding:3px 9px; font-size:12px; border-radius:5px; border:1px solid #c6d4cc; background:#fff; cursor:pointer; margin-right:4px; }
  button.mini:hover { border-color:var(--gl); color:var(--gl); }
  .empty { padding:40px; text-align:center; color:#889; }
  .err { color:#c62828; }
  .foot { padding:10px 22px 26px; font-size:12px; color:#7a8a83; }
  .lock { padding:80px 20px; text-align:center; }
  .lock input { padding:10px 14px; width:260px; border:1px solid #c6d4cc; border-radius:8px; font-size:14px; }
  .lock button { padding:10px 22px; border-radius:8px; border:0; background:var(--gl); color:#fff; font-size:14px; margin-left:8px; cursor:pointer; }
</style>
</head>
<body>
<header>
  <h1>AI内容创作工作台 · 线索管理</h1>
  <span class="hint">数据源：CloudBase leads 集合（试用 / 演示 / 渠道合作）</span>
</header>
<div id="root"></div>
<script>
var KEY = sessionStorage.getItem("lead_admin_key") || "";
var BASE = location.pathname;
if (BASE.slice(-1) === "/") { BASE = BASE.slice(0, -1); }

function h(v){ return String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }
function timeLocal(iso){ if(!iso) return "-"; var d=new Date(iso); if(isNaN(d)) return h(iso); return d.toLocaleString("zh-CN",{hour12:false}); }
function tLabel(t){ return ({trial:"试用",demo:"演示",partner:"合作"})[t]||t||"-"; }
function sLabel(s){ return ({new:"新线索",contacted:"已联系",done:"已完成",invalid:"无效"})[s]||s||"-"; }
function sClass(s){ return "s-"+(s||"new"); }
function tClass(t){ return "t-"+(t||"trial"); }
function needsTxt(a){ return Array.isArray(a)&&a.length?a.join("、"):"-"; }

function renderLock(){
  var root=document.getElementById("root");
  root.innerHTML = '<div class="lock"><h2>请输入管理口令</h2><div><input id="k" type="password" placeholder="管理口令" autocomplete="off"/><button id="keyGo">进入</button></div><p class="err" id="err"></p></div>';
  document.getElementById("keyGo").addEventListener("click", tryKey);
  document.getElementById("k").addEventListener("keydown", function(e){ if(e.key === "Enter") tryKey(); });
  document.getElementById("k").focus();
}
function tryKey(){
  var kEl = document.getElementById("k");
  if(!kEl){ renderLock(); return; }
  var k = kEl.value.trim();
  if(!k){ return; }
  fetch(BASE + "/api?action=check&key=" + encodeURIComponent(k))
    .then(function(res){
      if(!res.ok){ return res.json().catch(function(){ throw new Error("HTTP " + res.status); }); }
      return res.json();
    })
    .then(function(d){
      if(d && d.code === 0){ KEY = k; sessionStorage.setItem("lead_admin_key", k); load(); }
      else { document.getElementById("err").textContent = (d && d.message) || "口令错误"; }
    })
    .catch(function(e){
      var msg = (e && e.message) || "网络错误";
      document.getElementById("err").textContent = "连接失败：" + msg + "，请检查网络或稍后重试";
    });
}
function toolbar(){
  return '<div class="toolbar">' +
    '<select id="fType"><option value="">全部类型</option><option value="trial">试用</option><option value="demo">演示</option><option value="partner">合作</option></select>' +
    '<select id="fStatus"><option value="">全部状态</option><option value="new">新线索</option><option value="contacted">已联系</option><option value="done">已完成</option><option value="invalid">无效</option></select>' +
    '<button id="btnRefresh">刷新</button>' +
    '<span id="total" style="font-size:12px;color:#7a8a83"></span>' +
    '<span class="mail-box"><button id="btnMail" class="mini">通知邮箱</button></span>' +
    '<span class="key-box"><button id="btnLock" class="mini">锁定 / 退出</button></span>' +
    '</div>';
}
function rows(data){
  if(!data || !data.length){ return '<div class="empty">暂无线索</div>'; }
  var out = '<table><thead><tr><th>提交时间</th><th>类型</th><th>状态</th><th>机构/公司</th><th>行业</th><th>地区</th><th>联系人</th><th>手机号</th><th>微信</th><th>团队/需求/业务</th><th>留言</th><th>来源</th><th>操作</th></tr></thead><tbody>';
  data.forEach(function(d){
    var lead = d.lead_type || "";
    var extra = "";
    if(lead === "trial"){ extra = "团队：" + h(d.team_size || "-") + "<br/>需求：" + needsTxt(d.needs); }
    if(lead === "demo"){ extra = "行业：" + h(d.organization_type || "-"); }
    if(lead === "partner"){ extra = "业务：" + h(d.business || "-") + "<br/>区域：" + h(d.coverage || "-") + "/" + h(d.client_resources || "-"); }
    var actBtns = "";
    if(d.status !== "contacted"){ actBtns += '<button class="mini" data-act="contacted" data-id="' + d._id + '">已联系</button>'; }
    if(d.status !== "done"){ actBtns += '<button class="mini" data-act="done" data-id="' + d._id + '">已完成</button>'; }
    actBtns += '<button class="mini" data-act="invalid" data-id="' + d._id + '">无效</button>';
    actBtns += '<button class="mini" data-act="del" data-id="' + d._id + '" style="color:#c62828">删除</button>';
    out += "<tr>" +
      "<td>" + timeLocal(d.created_at) + "</td>" +
      "<td><span class='tag " + tClass(lead) + "'>" + tLabel(lead) + "</span></td>" +
      "<td><span class='tag " + sClass(d.status) + "'>" + sLabel(d.status) + "</span></td>" +
      "<td>" + h(d.organization_name) + "</td>" +
      "<td>" + h(d.organization_type || "-") + "</td>" +
      "<td>" + h(d.province || "") + " " + h(d.city || "") + "</td>" +
      "<td>" + h(d.contact_name) + "</td>" +
      "<td>" + h(d.mobile) + "</td>" +
      "<td>" + h(d.wechat || "-") + "</td>" +
      "<td>" + extra + "</td>" +
      "<td class='msg'>" + h(d.message || "-") + "</td>" +
      "<td>" + h(d.source || "direct") + "<br/><span style='font-size:11px;color:#9aa'>" + h(d.landing_page || d.source_page || "") + "</span></td>" +
      "<td>" + actBtns + "</td></tr>";
  });
  out += "</tbody></table>";
  return out;
}
function bindToolbar(){
  document.getElementById("btnRefresh").addEventListener("click", load);
  document.getElementById("btnLock").addEventListener("click", lock);
  document.getElementById("btnMail").addEventListener("click", mailSettings);
  document.getElementById("fType").addEventListener("change", load);
  document.getElementById("fStatus").addEventListener("change", load);
}
function load(){
  // 若工具栏尚未渲染（如带已存口令直接进入），先渲染骨架再读取
  if(!document.getElementById("fType")){
    document.getElementById("root").innerHTML = toolbar() + '<div class="empty">加载中…</div>';
    bindToolbar();
  }
  var type = document.getElementById("fType").value;
  var status = document.getElementById("fStatus").value;
  var q = BASE + "/api?action=list&key=" + encodeURIComponent(KEY) + "&type=" + encodeURIComponent(type) + "&status=" + encodeURIComponent(status);
  fetch(q).then(function(r){ return r.json(); }).then(function(d){
    if(d.code === 0){
      document.getElementById("root").innerHTML = toolbar() + rows(d.data.list) + '<div class="foot">共 ' + d.data.total + ' 条匹配线索（最新优先，最多 200 条），时间均为北京时间。</div>';
      bindToolbar();
    } else if(d.code === 401){
      sessionStorage.removeItem("lead_admin_key"); KEY = ""; renderLock();
    } else {
      document.getElementById("root").innerHTML = '<div class="err" style="padding:20px">' + h((d && d.message) || "加载失败") + '</div>';
    }
  }).catch(function(e){ document.getElementById("root").innerHTML = '<div class="err" style="padding:20px">加载失败：' + h((e && e.message) || "网络错误") + '，请刷新重试</div>'; });
}
function doSet(id, actn){
  var lbl = sLabel(actn);
  if(!confirm("确认将该线索标记为「" + lbl + "」？")) return;
  var u = BASE + "/api?action=set&key=" + encodeURIComponent(KEY) + "&id=" + encodeURIComponent(id) + "&status=" + encodeURIComponent(actn);
  fetch(u).then(function(r){ return r.json(); }).then(function(d){
    if(d.code === 0){ load(); } else { alert((d && d.message) || "操作失败"); }
  }).catch(function(){ alert("操作失败"); });
}
document.addEventListener("click", function(ev){
  var b = ev.target;
  if(!b || !b.closest) return;
  b = b.closest("button[data-act]");
  if(!b) return;
  var id = b.getAttribute("data-id") || "";
  var actn = b.getAttribute("data-act");
  if(actn === "del"){
    if(confirm("确认删除该线索？此操作不可恢复。")){
      var u = BASE + "/api?action=del&key=" + encodeURIComponent(KEY) + "&id=" + encodeURIComponent(id);
      fetch(u).then(function(r){ return r.json(); }).then(function(d){
        if(d.code === 0){ load(); } else { alert((d && d.message) || "删除失败"); }
      }).catch(function(){ alert("删除失败"); });
    }
    return;
  }
  doSet(id, actn);
});
function mailSettings(){
  fetch(BASE + "/api?action=getconfig&key=" + encodeURIComponent(KEY)).then(function(r){ return r.json(); }).then(function(d){
    var cur = (d && d.code === 0 && d.data && d.data.to_email) ? d.data.to_email : "";
    var tip = "当前通知邮箱：" + (cur || "（未设置 → 默认发件邮箱本人）") + "\n\n请输入新的新线索通知收件邮箱：";
    var v = window.prompt(tip, cur || "");
    if(v === null){ return; }
    v = v.trim();
    if(!v){ alert("邮箱不能为空"); return; }
    fetch(BASE + "/api?action=setconfig&key=" + encodeURIComponent(KEY) + "&email=" + encodeURIComponent(v)).then(function(r){ return r.json(); }).then(function(d2){
      if(d2.code === 0){ alert("已保存：" + v + "。之后新线索会发送到该邮箱。"); }
      else { alert((d2 && d2.message) || "保存失败"); }
    }).catch(function(){ alert("保存失败，请重试"); });
  }).catch(function(){ alert("读取当前配置失败"); });
}
function lock(){ sessionStorage.removeItem("lead_admin_key"); KEY = ""; renderLock(); }
(function init(){
  if(!KEY){ renderLock(); } else { load(); }
})();
</script>
</body>
</html>
